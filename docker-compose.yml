services:
    app:
        build: .
        ports:
            - "3000:3000"
        environment:
            MONGODB_URI: mongodb://mongo:27017/warehouse_os
            NEXTAUTH_URL: http://localhost:3000
            NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret}
        depends_on:
            - mongo

    mongo:
        image: mongo:7
        ports:
            - "27017:27017"
        volumes:
            - mongo-data:/data/db

volumes:
    mongo-data:
